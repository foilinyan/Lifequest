name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:

    name: Build Life Quest APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROIDSDK: /opt/android-sdk

      ANDROIDNDK: /opt/android-sdk/ndk/28.2.13676358
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "23"


    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            libffi-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            patch


      - name: Install Android SDK
        run: |

          sudo rm -rf $ANDROID_HOME

          sudo mkdir -p $ANDROID_HOME/cmdline-tools

          wget -q \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -O /tmp/sdk.zip


          unzip -q /tmp/sdk.zip \
          -d /tmp/sdk


          sudo mkdir -p \
          $ANDROID_HOME/cmdline-tools/latest


          sudo cp -R \
          /tmp/sdk/cmdline-tools/* \
          $ANDROID_HOME/cmdline-tools/latest/


          sudo chown -R \
          $USER:$USER \
          $ANDROID_HOME


          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH


          yes | \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$ANDROID_HOME \
          --licenses || true


          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$ANDROID_HOME \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;28.2.13676358"



      - name: Fix sdkmanager path
        run: |

          rm -rf $ANDROID_HOME/tools

          ln -s \
          $ANDROID_HOME/cmdline-tools/latest \
          $ANDROID_HOME/tools



      - name: Verify tools
        run: |

          python --version

          java -version

          test -f \
          $ANDROID_HOME/build-tools/35.0.0/aidl

          test -d \
          $ANDROIDNDK



      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
          buildozer==1.5.0 \
          cython==0.29.37


          buildozer --version



      - name: Check project
        run: |

          test -f main.py

          test -f buildozer.spec

          echo "Requirements:"
          grep "^requirements" buildozer.spec

          python -m py_compile main.py



      - name: Clean build
        run: |

          rm -rf .buildozer

          rm -rf bin

          mkdir bin



      - name: Build APK
        run: |

          set -o pipefail

          buildozer -v android debug \
          2>&1 | tee build.log



      - name: Show error
        if: failure()
        run: |

          echo "LAST LOG"

          tail -n 200 build.log


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: life-quest-apk

          path: bin/*.apk
