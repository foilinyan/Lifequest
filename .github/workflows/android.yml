name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Life Quest APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROIDSDK: /opt/android-sdk
      ANDROIDNDK: /opt/android-sdk/ndk/28.2.13676358
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "23"
      NDKAPI: "23"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            python3-pip \
            python3-venv

      - name: Install Android command-line tools
        run: |
          sudo rm -rf "$ANDROID_HOME"
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-command-tools.zip

          rm -rf /tmp/android-command-tools
          mkdir -p /tmp/android-command-tools

          unzip -q \
            /tmp/android-command-tools.zip \
            -d /tmp/android-command-tools

          sudo mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          sudo cp -R \
            /tmp/android-command-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          sudo chown -R "$USER:$USER" "$ANDROID_HOME"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Create legacy sdkmanager path for Buildozer
        run: |
          rm -rf "$ANDROID_HOME/tools"

          ln -s \
            "$ANDROID_HOME/cmdline-tools/latest" \
            "$ANDROID_HOME/tools"

          echo "Modern sdkmanager:"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Buildozer-compatible sdkmanager:"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"

          test -x "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install SDK, Build Tools, AIDL and NDK
        run: |
          "$ANDROID_HOME/tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android installation
        run: |
          echo "SDK Manager:"
          test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          "$ANDROID_HOME/tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --version

          echo "AIDL:"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "Android platform:"
          test -d "$ANDROID_HOME/platforms/android-35"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo "NDK:"
          test -d "$ANDROIDNDK"
          ls -la "$ANDROIDNDK"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            buildozer \
            cython==0.29.36

          buildozer --version

      - name: Clean previous project build
        run: |
          sudo rm -rf .buildozer
          sudo rm -rf bin
          mkdir -p bin

      - name: Show Buildozer configuration
        run: |
          echo "buildozer.spec Android settings:"
          grep -E \
            "android.api|android.minapi|android.ndk|android.sdk_path|android.ndk_path|android.archs|p4a.branch" \
            buildozer.spec || true

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Find generated APK
        if: always()
        run: |
          echo "Generated Android files:"
          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-quest-apk
          path: bin/*.apk
          if-no-files-found: error
