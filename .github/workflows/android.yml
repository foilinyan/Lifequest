name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Life Quest APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROIDSDK: /opt/android-sdk
      ANDROIDNDK: /opt/android-sdk/ndk/28.2.13676358
      ANDROIDAPI: "35"
      ANDROIDMINAPI: "23"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            python3-pip \
            python3-venv

      - name: Install Android command line tools
        run: |
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          sudo unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          sudo mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          sudo mv /tmp/android-tools/cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          sudo chown -R "$USER:$USER" "$ANDROID_HOME"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK, AIDL and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Check Android tools
        run: |
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo "AIDL:"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null || true

          echo "NDK:"
          test -d "$ANDROIDNDK"
          ls -la "$ANDROIDNDK"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install \
            buildozer \
            cython==0.29.36

      - name: Clean previous build
        run: |
          sudo rm -rf .buildozer
          sudo rm -rf bin
          mkdir -p bin

      - name: Configure Buildozer SDK paths
        run: |
          sed -i \
            's|^#\?android.sdk_path *=.*|android.sdk_path = /opt/android-sdk|' \
            buildozer.spec

          sed -i \
            's|^#\?android.ndk_path *=.*|android.ndk_path = /opt/android-sdk/ndk/28.2.13676358|' \
            buildozer.spec

          echo ""
          echo "Android settings:"
          grep -E \
            "android.api|android.minapi|android.ndk|android.sdk_path|android.ndk_path|p4a.branch" \
            buildozer.spec || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find generated APK
        if: always()
        run: |
          echo "Generated files:"
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-quest-apk
          path: bin/*.apk
          if-no-files-found: error
